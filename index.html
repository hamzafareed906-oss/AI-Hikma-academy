<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <script>
      (function() {
        // Suppress WebSocket errors and unhandled rejections globally before any scripts load
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message ? reason.message : '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws:') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws:') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        // Intercept Vite HMR WebSocket so it never attempts to open in the preview iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('localhost') !== -1))) {
              var dummy = {
                readyState: 3, // CLOSED
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                url: url
              };
              return dummy;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
        }
      })();
    </script>
